# Publishes the approved Harness step image (Node 24 + signed Postman CLI) to
# GHCR so consumers pull instead of building locally. Trigger: changes to the
# Dockerfile on the default branch, or manual dispatch. No third-party build
# actions — plain docker build/push with the repo-scoped GITHUB_TOKEN.
name: publish-tools-image

on:
  push:
    branches: [main]
    paths:
      - docker/postman-tools/**
      - scripts/ensure-postman-assets.mjs
      - scripts/compare-routes.mjs
      - .github/workflows/publish-tools-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            -f docker/postman-tools/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/postman-tools:node24 \
            .

      - name: Record provenance labels
        run: |
          docker inspect ghcr.io/${{ github.repository_owner }}/postman-tools:node24 \
            --format 'imageId={{.Id}}' | tee tools-image-provenance.txt

      - name: Push image
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/postman-tools:node24
